# ============================================================
#  GMAO - Configuration Spring Boot / MySQL (XAMPP)
# ============================================================

# ── Source de données ────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/gmao?useSSL=false&serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# validate  → vérifie le schéma sans le modifier (production)
# update    → met à jour le schéma automatiquement    (dev)
# create    → recrée le schéma à chaque démarrage     (tests)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ── Audit JPA (CreatedDate / LastModifiedDate) ───────────────
# Activer dans votre classe @SpringBootApplication :
#   @EnableJpaAuditing
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Paris
